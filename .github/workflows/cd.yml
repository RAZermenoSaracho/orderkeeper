name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: orderkeeper-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, macOS, orderkeeper-production]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Check out the tested deployment revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Deploy tested main revision
        run: bash .github/scripts/deploy-production.sh "${DEPLOY_SHA}"
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
