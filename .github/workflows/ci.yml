name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Detects which service directories changed so each job below only runs
  # when its own service is touched — matches this project's "independent
  # services, no shared tooling" convention (CLAUDE.md's Planned Structure)
  # even though all four jobs live in one workflow file for visibility.
  changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      order-indexer: ${{ steps.filter.outputs.order-indexer }}
      keeper-bot: ${{ steps.filter.outputs.keeper-bot }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'
            order-indexer:
              - 'order-indexer/**'
            keeper-bot:
              - 'keeper-bot/**'
            frontend:
              - 'frontend/**'

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      # Pinned to match the version installed locally (`forge --version`)
      # rather than resolving whatever's current at runner execution time —
      # otherwise CI silently drifts onto newer Foundry releases, which has
      # already broken a test once (stricter vm.prank semantics around
      # unconsumed pranks before a `new` / CREATE call; see the setUp()
      # fixes in test/OrderKeeper*.sol). Bump deliberately, not implicitly.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      # contracts/dependencies/ is gitignored — reinstalled here from
      # soldeer.lock, which pins every dependency to an exact commit
      # (resolved from a tag where one exists, or a specific commit via
      # --rev for v2-periphery, which has no matching upstream tag for the
      # version in use). See Milestone 8 in ROADMAP.md for why this
      # replaced plain `forge install` — that had no lockfile at all.
      - name: Install Solidity dependencies
        run: forge soldeer install

      - name: Check formatting
        run: forge fmt --check

      - name: Run tests
        run: forge test

      # forge coverage has no built-in pass/fail threshold, and its Total
      # row includes script/ and test-helper files that are never meant
      # to hit 100% — so this checks src/OrderKeeper.sol and src/DemoUSDC.sol
      # specifically, matching CLAUDE.md's documented "100% coverage" bar.
      - name: Check src/ coverage is 100%
        run: |
          forge coverage --report summary --exclude-tests | tee coverage_summary.txt
          if ! grep -q "^| src/" coverage_summary.txt; then
            echo "::error::No src/ rows found in coverage summary — output format may have changed"
            exit 1
          fi
          if grep "^| src/" coverage_summary.txt | grep -qv "100.00%.*100.00%.*100.00%.*100.00%"; then
            echo "::error::contracts/src/ coverage dropped below 100%"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Slither
        run: pip install slither-analyzer==0.11.6

      # --filter-paths excludes dependencies/ findings — CLAUDE.md scopes
      # Slither triage to src/ only; dependencies/ is external code, out
      # of scope (see CLAUDE.md's Conventions).
      - name: Run Slither (src/ only)
        run: slither src/ --filter-paths "dependencies/"

  order-indexer:
    needs: changes
    if: needs.changes.outputs.order-indexer == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: order-indexer/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  keeper-bot:
    needs: changes
    if: needs.changes.outputs.keeper-bot == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeper-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: keeper-bot/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      # No VITE_* env vars needed here: vite build only bundles the code,
      # it doesn't execute it — the runtime "throw if unset" checks in
      # src/config.ts only run in an actual browser, never during build.
      - name: Typecheck + build
        run: npm run build
